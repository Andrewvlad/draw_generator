<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Skydiving draw generator">
    <meta name="author" content="Andrew Vladelshchikov">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FS Dive Generator</title>
    <link rel="stylesheet" type="text/css" href="stylesheet.css">
    <style id="pageSizeRule"></style> <!--JS injects @page{size:X} when a specific paper is chosen-->
</head>
<body>

<header>
    <h1>Draw Generator</h1>
    <button type="button" class="icon" title="Copy to clipboard" aria-label="Copy to clipboard" onclick="copyToClipboard()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg>
    </button>
    <button type="button" class="icon" id="printButton" title="Save as PDF" aria-label="Save as PDF" onclick="printDives()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    </button>
</header>

<main>
<!--Settings drawer-->
    <aside id="settingsDrawer">
        <details id="setup-section" open>
            <summary>
                Setup
                <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
            </summary>
            <div class="section-body">
                <div>
                    <label for="divePool">Discipline</label>
                    <select id="divePool" onchange="changePool()">
                        <option value="4-way_fs">4-way</option>
                        <option value="8-way_fs">8-way</option>
                    </select>
                </div>

                <div id="outdoorDiv" hidden><!--hidden technically dead from parent flex style (left for readability)-->
                    <label for="useOutdoor">Outdoor</label>
                    <input type="checkbox" id="useOutdoor" class="toggle" role="switch" onchange="changePool()">
                </div>

                <div>
                    <label for="numDives">Dives</label>
                    <input id="numDives" type="number" min="1" max="99" value="10" onchange="addToPage()" required>
                </div>

                <div>
                    <label for="points">Points</label>
                    <select id="points" onchange="addToPage()">
                        <option value="3">3 - 4</option>
                        <option value="4">4 - 5</option>
                        <option value="5">5 - 6</option>
                    </select>
                </div>
            </div>
        </details>
        <details id="constraints-section" open>
            <summary>
                Constraints
                <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
            </summary>
            <div class="section-body">
                <div>
                    <label id="include-label">Include</label>
                    <div id="includeSegment" class="segmentedControl" role="radiogroup" aria-labelledby="include-label">
                        <label for="include-all">All</label>
                        <input type="radio" name="include" id="include-all" value="all" onchange="addToPage()" checked>
                        <label for="include-randoms">Randoms</label>
                        <input type="radio" name="include" id="include-randoms" value="randoms" onchange="addToPage()">
                        <label for="include-blocks">Blocks</label>
                        <input type="radio" name="include" id="include-blocks" value="blocks" onchange="addToPage()">
                    </div>
                </div>

                <div>
                    <label for="uniqueExits">Unique Exits</label>
                    <input type="checkbox" id="uniqueExits" class="toggle" role="switch" onchange="checked && addToPage()">
                </div>

                <div>
                    <label for="uniqueTransitions" title="Transitions are basic-unique (similar formations are still treated as unique)">Unique Transitions*</label>
                    <input type="checkbox" id="uniqueTransitions" class="toggle" role="switch" onchange="checked && addToPage()">
                </div>

            </div>
        </details>
        <details id="print-section">
            <summary>
                Print
                <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
            </summary>
            <div class="section-body">
                <div>
                    <label for="paperSize">Paper size</label>
                    <select id="paperSize" onchange="setPaper(this.value)">
                        <option value="auto" selected>Auto</option>
                        <option value="Letter">Letter</option>
                        <option value="A4">A4</option>
                        <option value="A5">A5</option>
                        <option value="Legal">Legal</option>
                    </select>
                </div>

                <div>
                    <label for="rowsPerPage">Rows per page</label>
                    <select id="rowsPerPage" onchange="setRows(this.value)">
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4" selected>4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                    </select>
                </div>
            </div>
        </details>
    </aside>
    <!--Restore saved settings before first paint so sections and segmented control thumb don't flash-->
    <script>
        const STORAGE_KEY = "drawGenerator";

        // Every control in the drawer and respective section's collapsed state
        const persistedElements = () => document.querySelectorAll("#settingsDrawer :is(details, input, select)");

        // Derive state
        const stateKey = (element) =>
            element.type === "checkbox" ? "checked"
            : element.tagName === "DETAILS" ? "open" : "value";

        function restoreSettings() {
            let stored = {};

            // Error -> restore defaults (defined in HTML)
            try {stored = JSON.parse(localStorage.getItem(STORAGE_KEY)) ?? {}} catch {}

            persistedElements().forEach(element => {
                // Checking a radio clears its group, so an unknown value leaves the HTML default alone
                if (element.type === "radio") {
                    if (element.value === stored[element.name]) element.checked = true;
                    return;
                }

                if (!(element.id in stored)) return;

                const key = stateKey(element);

                if (key !== "value") {
                    element[key] = stored[element.id] === true;
                    return;
                }

                // Out-of-range/invalid falls back to default
                const fallback = element.value;
                element.value = stored[element.id];
                if (!element.value || !element.checkValidity()) element.value = fallback;
            });
        }

        restoreSettings();
    </script>
    <!--Start drawer collapsed on mobile devices. Before first paint to prevent flash-->
    <script>
        if (getComputedStyle(document.documentElement).getPropertyValue('--drawer-default') === 'collapsed') {
            const drawer = document.getElementById('settingsDrawer');
            drawer.classList.add('noTransition'); // Disable transitions
            drawer.inert = true;
            drawer.offsetHeight; // Trigger a reflow, flushing the CSS changes
            drawer.classList.remove('noTransition'); // Re-enable transitions
        }
    </script>

    <!--Draw display-->
    <section>
        <div id="previewHeader">
            <h2>Preview</h2>
            <button type="button" id="editToggle" class="icon" title="Edit dives" aria-label="Edit dives" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
            </button>
            <div id="previewSegment" class="segmentedControl" role="radiogroup" aria-label="Preview">
                <label for="preview-text">Text</label>
                <input type="radio" name="preview" id="preview-text" value="text" checked>
                <label for="showImages">Images</label>
                <input type="radio" name="preview" id="showImages" value="images">
            </div>
        </div>
        <div id="dives"></div>
        <!--Hidden HTML element (for CSS to consume during print)-->
        <div id="diveImages" data-rows="4" style="--rows: 4; --paper-mm: 279.4mm"></div>
    </section>
</main>

<footer>
    <button type="button" id="generate" onclick="addToPage()">Generate dives</button>
    <button type="button" id="settingsToggle" title="Settings" aria-label="Toggle settings panel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
</footer>

<div id="copyClipboardToast" class="toast">Copied to clipboard</div>


<!--Scripts-->
<script src="assets/diagrams/4-way_fs/rhythm/index.js"></script> <!--Load all 4-way images-->
<script src="assets/diagrams/8-way_fs/rhythm/index.js"></script> <!--Load all 8-way images-->
<script src="index.js"></script>
<!--Element selection-->
<script>
    const diveList = document.getElementById("dives");
    const diveImages = document.getElementById("diveImages");
</script>
<!--Switch between image sets-->
<script>
    let imagePaths; // Used by divesAsImages()
    const divePool = document.getElementById("divePool");
    const outdoorDiv = document.getElementById("outdoorDiv");
    const useOutdoor = document.getElementById("useOutdoor");

    // Image set per discipline, and whether it offers an outdoor variant
    const DISCIPLINES = {
        "4-way_fs": {images: () => imagePaths4Way},
        "8-way_fs": {images: () => useOutdoor.checked ? imagePaths8WayOutdoor : imagePaths8Way, hasOutdoor: true},
    };

    function syncPool() {
        const discipline = DISCIPLINES[divePool.value];
        outdoorDiv.style.display = discipline.hasOutdoor ? "" : "none";
        imagePaths = discipline.images();
    }

    syncPool();

    function changePool() {
        syncPool();

        // Reload the images
        diveImages.innerHTML = divesAsImages(generatedDives);
    }
</script>
<!--Listeners-->
<script>
    // Settings drawer toggle
    const settingsToggle = document.getElementById('settingsToggle');
    const settingsDrawer = document.getElementById('settingsDrawer');

    // Sync with initial --drawer-default value
    settingsToggle.setAttribute('aria-expanded', !settingsDrawer.inert);

    settingsToggle.addEventListener('click', () => {
        settingsDrawer.inert = !settingsDrawer.inert;
        settingsToggle.setAttribute('aria-expanded', !settingsDrawer.inert);
    });

    // Segment controls
    const includeSegment = document.getElementById('includeSegment');
    const previewSegment = document.getElementById('previewSegment');
    const showImages = document.getElementById('showImages');

    // Because the segments don't have uniform widths, the thumb needs to resize mid-animation
    function syncThumb(segmentedControl) {
        // Rects over offsetLeft/offsetWidth since rounding missaligns the thumb
        const selected = segmentedControl.querySelector("label:has(+ :checked)").getBoundingClientRect();
        const track = segmentedControl.getBoundingClientRect();
        segmentedControl.style.setProperty("--thumb-x", `${selected.left - track.left}px`);
        segmentedControl.style.setProperty("--thumb-w", `${selected.width}px`);
    }

    // Seed so that the initial segmented value does not animate on first paint
    document.querySelectorAll(".segmentedControl").forEach(segmentedControl => {
        syncThumb(segmentedControl);
        getComputedStyle(segmentedControl, "::before").width; // Flush, so the seeded box is the transition's start point
        segmentedControl.dataset.ready = ""; // Enable the animation
        segmentedControl.addEventListener("change", () => syncThumb(segmentedControl));
    });
</script>
<!--Settings persistence-->
<script>
    function saveSettings() {
        const settings = {};
        persistedElements().forEach(element => {
            // A radio group stores one value, under the parent grouping
            if (element.type === "radio") {
                if (element.checked) settings[element.name] = element.value;
                return;
            }

            settings[element.id] = element[stateKey(element)];
        });

        try {localStorage.setItem(STORAGE_KEY, JSON.stringify(settings))} catch {} // Storage may be unavailable
    }

    // Save all setting changes
    settingsDrawer.addEventListener("change", saveSettings);
    settingsDrawer.addEventListener("toggle", saveSettings, true); // Toggle does not bubble, so it needs capture
</script>
<!--Dive settings-->
<script>
    const numDives = document.getElementById("numDives");
    const minPoints = document.getElementById("points");
    const uniqueExits = document.getElementById("uniqueExits");
    const uniqueTransitions = document.getElementById("uniqueTransitions");

    function drawSettings() {
        const include = includeSegment.querySelector(":checked").value;

        return {
            numDives: numDives.value,
            minPoints: minPoints.value,
            uniqueExits: uniqueExits.checked,
            uniqueTransitions: uniqueTransitions.checked,
            useRandoms: include !== "blocks",
            useBlocks: include !== "randoms",
        };
    }
</script>
<!--Dive generation-->
<script>
    let generatedDives;

    function addToPage() {
        if (numDives.checkValidity() && minPoints.checkValidity()) {
            // Generate the draw
            generatedDives = main(drawSettings());

            // Add dives to the page
            diveList.innerHTML = listDives(generatedDives, minPoints.value);
            diveImages.innerHTML = divesAsImages(generatedDives);

            setEditable();
        }
    }
</script>
<!--Dive editing-->
<script>
    // Edit toggle
    const editToggle = document.getElementById("editToggle");
    let divesEdited = false;

    editToggle.addEventListener("click", () => {
        const editing = editToggle.ariaPressed !== "true";
        editToggle.ariaPressed = editing;

        // Turn off image preview during edit
        showImages.disabled = editing;
        document.getElementById("preview-text").checked = true;
        syncThumb(previewSegment);

        setEditable();
    });

    function setEditable() {
        const editing = editToggle.ariaPressed === "true";
        diveList.querySelectorAll(".cell").forEach(cell => cell.contentEditable = editing ? "plaintext-only" : "false");
    }

    // On user input
    diveList.addEventListener("input", event => {
        const cell = event.target;

        // Limit length to two and strip whitespace
        const normalized = cell.textContent.replace(/\s/g, "").slice(0, 2);
        if (cell.textContent !== normalized) {
            cell.textContent = normalized;

            // User input remains at the end of the input, instead of jumping to start
            getSelection().collapse(cell, cell.childNodes.length);
        }

        divesEdited = true;
        syncEdits();
    });

    const parsePoint = (text) => /^\d+$/.test(text) ? Number(text) : text.toUpperCase();

    // Write the cells back into generatedDives, then paint rule violations
    function syncEdits() {
        // Clear all (old) invalid markings
        diveList.querySelectorAll(".invalid").forEach(marked => marked.classList.remove("invalid"));

        const rows = [...diveList.querySelectorAll("li")];
        const filledCells = rows.map(row => [...row.querySelectorAll(".cell")].filter(cell => cell.textContent)); // Skip empty cells

        // Set the new draw
        generatedDives = filledCells.map(cells => cells.map(cell => parsePoint(cell.textContent)));

        // Mark cells & rows invalid
        validateDraw(generatedDives, drawSettings()).forEach((report, i) => {
            report.cells.forEach((invalid, j) => filledCells[i][j].classList.toggle("invalid", invalid));
            rows[i].classList.toggle("invalid", report.invalid);
        });
    }

    // Rebuild diveImages after edits are complete. Focusout so that [CTRL+P] is also caught
    diveList.addEventListener("focusout", () => {
        if (divesEdited) {
            divesEdited = false;
            diveImages.innerHTML = divesAsImages(generatedDives);
        }
    });

    /** Keyboard navigation **/
    // TODO: Add arrow-key support

    // Select the contents of the cell for editing on arrival
    const selectCell = (cell) => getSelection().selectAllChildren(cell);

    // Focus ([Tab], [Shift+Tab])
    diveList.addEventListener("focusin", event => selectCell(event.target));

    // [Enter]
    diveList.addEventListener("keydown", event => {
        if (event.key !== "Enter") return;

        event.preventDefault(); // Stops newline

        // Navigate to next line after reaching the end of the dive (or from very bottom to top)
        const cells = [...diveList.querySelectorAll(".cell")];
        selectCell(cells[(cells.indexOf(event.target) + 1) % cells.length]);
    });
</script>
<!--Image printing-->
<script>
    const cache = new Map(); // Cache downscaled data URLs by src

    async function printDives() {
        const printButton = document.getElementById("printButton");
        printButton.disabled = true;

        const originalImages = new Map();
        const images = document.querySelectorAll("#diveImages img");
        const scale = 0.35; // Scale images to 35% (~150 DPI)

        // Downscale each image once, then reuse from cache
        await Promise.all(Array.from(images).map(async image => {
            if (!cache.has(image.src)) {
                cache.set(image.src, fetch(image.src)
                    .then(response => response.blob())
                    .then(blob => createImageBitmap(blob, {
                        resizeWidth: Math.round(image.naturalWidth * scale),
                        resizeHeight: Math.round(image.naturalHeight * scale),
                        resizeQuality: "high",
                    }))
                    .then(bitmap => {
                        const canvas = document.createElement("canvas");
                        canvas.width = bitmap.width;
                        canvas.height = bitmap.height;
                        canvas.getContext("2d").drawImage(bitmap, 0, 0);
                        bitmap.close();
                        return canvas.toDataURL("image/png");
                    })
                );
            }
            originalImages.set(image, image.src);
            image.src = await cache.get(image.src);
        }));

        window.print();
        // Restore images after printing
        originalImages.forEach((src, image) => image.src = src);
        printButton.disabled = false;
    }
</script>
<!--Print layout-->
<script>
    const PAPER_MM = { Letter: 279.4, A4: 297, A5: 210, Legal: 355.6 }; // Portrait long-edge, mm
    const pageSizeRule = document.getElementById("pageSizeRule");

    function setRows(value) {
        diveImages.dataset.rows = value;
        diveImages.style.setProperty("--rows", value); // For CSS calc (to determine page seams)
    }

    function setPaper(value) {
        // Row height/width defaults to Letter, unless manually defined
        const paper = value === "auto" ? "Letter" : value;
        diveImages.style.setProperty("--paper-mm", `${PAPER_MM[paper]}mm`);
        // PDF size is derived from browser, unless manually defined
        pageSizeRule.textContent = value === "auto" ? "" : `@page { size: ${value} }`;
    }
</script>
<!--Copy to clipboard & toast notification-->
<script>
    const toast = document.getElementById("copyClipboardToast");
    let toastTimeout;

    // Reset animation by removing and re-adding the class
    function refreshToast() {
        toast.classList.remove("show");
        toast.classList.add('noTransition'); // Disable transitions
        toast.offsetHeight; // Trigger a reflow, flushing the CSS changes
        toast.classList.remove('noTransition'); // Re-enable transitions
        toast.classList.add("show");

        clearTimeout(toastTimeout); // Clear existing timeout, if any
    }

    function copyToClipboard() {
        // Built from the draw rather than the preview (edits carry, but not typos)
        navigator.clipboard.writeText(divesAsText(generatedDives));

        // Display a toast notification
        refreshToast();
        toastTimeout = setTimeout(() => toast.classList.remove("show"), 1250);
    }
</script>
<!--Initial render-->
<script>
    // Apply the print selects, since restoreSettings() populates them without firing onchange
    setPaper(document.getElementById("paperSize").value);
    setRows(document.getElementById("rowsPerPage").value);
    addToPage();
</script>
