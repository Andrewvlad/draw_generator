    <!--Restore saved settings before first paint so sections and segmented control thumb don't flash-->
    <script>
        const STORAGE_KEY = "drawGenerator";

        // Every control in the drawer and respective section's collapsed state
        const persistedElements = () => document.querySelectorAll("#settingsDrawer :is(details, input, select)");

        // Derive state
        const stateKey = (element) =>
            element.type === "checkbox" ? "checked"
            : element.tagName === "DETAILS" ? "open" : "value";

        function restoreSettings() {
            let stored = {};

            // Error -> restore defaults (defined in HTML)
            try {stored = JSON.parse(localStorage.getItem(STORAGE_KEY)) ?? {}} catch {}

            persistedElements().forEach(element => {
                // Checking a radio clears its group, so an unknown value leaves the HTML default alone
                if (element.type === "radio") {
                    if (element.value === stored[element.name]) element.checked = true;
                    return;
                }

                if (!(element.id in stored)) return;

                // Restore the image set preference
                if ("preferred" in element.dataset) {
                    element.dataset.preferred = stored[element.id];
                    return;
                }

                const key = stateKey(element);

                if (key !== "value") {
                    element[key] = stored[element.id] === true;
                    return;
                }

                // Out-of-range/invalid falls back to default
                const fallback = element.value;
                element.value = stored[element.id];
                if (!element.value || !element.checkValidity()) element.value = fallback;
            });

            // Apply localStorage drawer width size
            if (stored.drawerSize > 0) {
                // Transitions need to be toggled off for the initial load, otherwise the animation plays when importing width from localStorage (Firefox)
                const mainElement = document.querySelector("main");
                mainElement.classList.add("noTransition");
                document.documentElement.style.setProperty("--drawer-size", `${stored.drawerSize}px`);
                mainElement.offsetHeight; // Trigger a reflow
                mainElement.classList.remove("noTransition");
            }

            // Apply localStorage mobile drawer max height
            if (typeof stored.drawerMobileSize === "number") { // Since it can be negative or 0, before it gets clamped
                document.documentElement.style.setProperty("--drawer-mobile-size", `${stored.drawerMobileSize}px`);
            }
        }

        restoreSettings();
    </script>
    <!--Start drawer collapsed on mobile devices. Before first paint to prevent flash-->
    <script>
        if (getComputedStyle(document.documentElement).getPropertyValue('--drawer-default') === 'collapsed') {
            const drawer = document.getElementById('settingsDrawer');
            drawer.classList.add('noTransition'); // Disable transitions
            drawer.inert = true;
            drawer.offsetHeight; // Trigger a reflow, flushing the CSS changes
            drawer.classList.remove('noTransition'); // Re-enable transitions
        }
    </script>

<!--Switch between image sets-->
<script>
    let imagePaths; // Used by divesAsImages()
    const divePool = document.getElementById("divePool");
    const outdoorDiv = document.getElementById("outdoorDiv");
    const useOutdoor = document.getElementById("useOutdoor");
    const imageSet = document.getElementById("image-set");

    // Combine classes with their expected point totals
    const classesWithPoints = (classes, points) => classes
        .filter(({key}) => key in points) // Only include classes with defined point totals (drops rookie and CISM)
        .map(diveClass => ({...diveClass, points: points[diveClass.key]}));

    // Set the classes and points (defined by the class)
    const DISCIPLINES = {
        "4-way": {classes: classesWithPoints(CLASSES["4-way"], {beginner: 3, intermediate: 4, open: 5})},
        "8-way": {classes: classesWithPoints(CLASSES["8-way"], {intermediate: 4, open: 5})},
        // Smaller pool (A - J and 1 - 12), and FSCards only one class
        "16-way": {randoms: randoms.slice(0, 9), blocks: blocks.slice(0, 12), classes: [{key: "open", label: "Open", points: 3}]},
        "4-way-vfs": {classes: classesWithPoints(CLASSES["4-way-vfs"], {intermediate: 3, advanced: 4, open: 5})},
        "2-way-mfs": {classes: classesWithPoints(CLASSES["2-way-mfs"], {intermediate: 3, advanced: 4, open: 5})},
    };

    // Rebuilds the image set dropdown when the discipline changes
    function fillImageSets() {
        imageSet.innerHTML = IMAGE_SETS[divePool.value].map(set => `<option>${set}</option>`).join("");

        // Default to preferred image set, otherwise fallback to USPA
        imageSet.value = imageSet.dataset.preferred;
        if (!imageSet.value) imageSet.value = "USPA";
    }

    function syncPool() {
        const discipline = divePool.value;
        const {randoms: disciplineRandoms = randoms, blocks: disciplineBlocks = blocks} = DISCIPLINES[discipline];
        const imageFiles = Object.fromEntries([...disciplineRandoms, ...disciplineBlocks].map(key => [key, `${imageSet.value}/${key}.webp`]));
        outdoorDiv.style.display = "none";

        // Only 8-way has a different outdoor and indoor pool
        if (discipline === "8-way") {
            outdoorDiv.style.display = "";
            if (!useOutdoor.checked) Object.assign(imageFiles, INDOOR_IMAGES[imageSet.value]); // Swap-in the indoor images
        }

        imagePaths = Object.fromEntries(Object.entries(imageFiles).map(([key, file]) => [key, `assets/diagrams/${discipline}/${file}`]));
    }

    fillImageSets();
    syncPool();

    function indoorSubstituteToast() {
        if (divePool.value === "8-way" && !useOutdoor.checked && imageSet.value === "USPA") {
            showToast("USPA (USIS) does not publish indoor diagrams - subbing FAI");
        }
    }

    // Switch between indoor and outdoor diagrams
    function changePool() {
        syncPool();
        indoorSubstituteToast();

        // Reload the images
        diveImages.innerHTML = divesAsImages(generatedDives);
    }

    function changeImageSet() {
        imageSet.dataset.preferred = imageSet.value;
        changePool();
    }
</script>
<!--Listeners-->
<script>
    // Settings drawer toggle
    const settingsToggle = document.getElementById('settingsToggle');
    const settingsDrawer = document.getElementById('settingsDrawer');

    // Sync with initial --drawer-default value
    settingsToggle.setAttribute('aria-expanded', !settingsDrawer.inert);

    function toggleDrawer() {
        settingsDrawer.inert = !settingsDrawer.inert;
        settingsToggle.setAttribute('aria-expanded', !settingsDrawer.inert);
    }

    settingsToggle.addEventListener('click', toggleDrawer);

    // Segment controls
    const includeSegment = document.getElementById('includeSegment');
    const previewSegment = document.getElementById('previewSegment');
    const showImages = document.getElementById('showImages');

    // Because the segments don't have uniform widths, the thumb needs to resize mid-animation
    // Resync after anything that resizes a segment, since nothing observes them
    function syncThumb(segmentedControl) {
        // Rects over offsetLeft/offsetWidth since rounding misaligns the thumb
        const selected = segmentedControl.querySelector("label:has(+ :checked)").getBoundingClientRect();
        const track = segmentedControl.getBoundingClientRect();
        segmentedControl.style.setProperty("--thumb-x", `${selected.left - track.left}px`);
        segmentedControl.style.setProperty("--thumb-w", `${selected.width}px`);
    }

    // Seed so that the initial segmented value does not animate on first paint
    document.querySelectorAll(".segmentedControl").forEach(segmentedControl => {
        syncThumb(segmentedControl);
        getComputedStyle(segmentedControl, "::before").width; // Flush, so the seeded box is the transition's start point
        segmentedControl.dataset.ready = ""; // Enable the animation
        segmentedControl.addEventListener("change", () => syncThumb(segmentedControl));
    });
</script>
<!--Drawer resizing-->
<script>
    const root = document.documentElement; // Sets the cursor pointer, even when the drawer closes (but still dragging)
    const drawerResizer = document.getElementById("drawer-resizer");
    const drawerGrabber = document.getElementById("drawer-grabber");
    const SNAP_DISTANCE = 100; // Amount of overshoot past min in px before drawer snaps closed

    let drawerMinWidth, cursorToEdge;

    drawerResizer.addEventListener("pointerdown", event => {
        if (event.button !== 0) return; // Cancels context clicks (only accepts left clicks, aka index 0)

        drawerResizer.setPointerCapture(event.pointerId); // Sets the cursor pointer, even when the drawer closes (but still dragging)

        // Position of the cursor relative to the settings drawer at drag start
        cursorToEdge = settingsDrawer.inert
            ? 0 // 0 when starting collapsed, so that the edge is perfectly inline under the cursor
            : settingsDrawer.getBoundingClientRect().right - event.clientX;

        // Find the min width of the settings drawer by its widest row (including non-visible rows)
        settingsDrawer.classList.add("measuring");
        drawerMinWidth = settingsDrawer.getBoundingClientRect().width;
        settingsDrawer.classList.remove("measuring");

        root.style.setProperty("--drawer-min", `${drawerMinWidth}px`);
        root.classList.add("resizing");
    });

    // Resize on drag
    drawerResizer.addEventListener("pointermove", event => {
        if (!drawerResizer.hasPointerCapture(event.pointerId)) return;

        const width = event.clientX + cursorToEdge;
        const open = width >= drawerMinWidth - SNAP_DISTANCE;
        if (!open && settingsDrawer.inert) return; // Remain closed, unless SNAP_DISTANCE is overshot (also prevents taps on the drawer-resizer from setting to min-width)
        if (open === settingsDrawer.inert) toggleDrawer(); // Toggle the drawer if the cursor overshoots the SNAP_DISTANCE
        root.style.setProperty("--drawer-size", `${open ? width : drawerMinWidth}px`); // Floors the width at drawerMinWidth
    });

    // Keeps the width the drawer reached
    drawerResizer.addEventListener("lostpointercapture", () => {
        if (!settingsDrawer.inert) root.style.setProperty("--drawer-size", `${settingsDrawer.getBoundingClientRect().width}px`);
        settingsDrawer.offsetHeight; // Flush while transitions are still off, so the swap doesn't animate
        root.classList.remove("resizing");
        saveSettings();
    });

    // Double-clicking opens and resets a drawer to its default width
    drawerResizer.addEventListener("dblclick", () => {
        root.style.removeProperty("--drawer-size");
        if (settingsDrawer.inert) toggleDrawer();
        saveSettings();
    });

    /** Mobile Drawer **/

    drawerGrabber.addEventListener("pointerdown", event => {
        if (event.button !== 0) return; // Cancels context clicks (only accepts left clicks, aka index 0)

        drawerGrabber.setPointerCapture(event.pointerId);
        cursorToEdge = settingsDrawer.getBoundingClientRect().top - event.clientY; // Position of the cursor relative to the settings drawer
        root.classList.add("resizing");
    });

    // Resize on drag
    drawerGrabber.addEventListener("pointermove", event => {
        if (!drawerGrabber.hasPointerCapture(event.pointerId)) return;

        // We let the CSS do the max-height clamping (25% - 75%)
        root.style.setProperty("--drawer-mobile-size", `${settingsDrawer.getBoundingClientRect().bottom - (event.clientY + cursorToEdge)}px`);
    });

    // On release, save the new height and restore cursor
    drawerGrabber.addEventListener("lostpointercapture", () => {
        root.classList.remove("resizing");
        saveSettings();
    });
</script>

<!--Settings persistence (localStorage)-->
<script>
    function saveSettings() {
        const settings = {};

        // Values from settingDrawer
        persistedElements().forEach(element => {
            // A radio group stores one value, under the parent grouping
            if (element.type === "radio") {
                if (element.checked) settings[element.name] = element.value;
                return;
            }

            settings[element.id] = element.dataset.preferred ?? element[stateKey(element)]; // Save preference (not selected fallback)
        });

        // Drawer width (unless default)
        const drawerSize = root.style.getPropertyValue("--drawer-size");
        if (drawerSize) settings.drawerSize = parseFloat(drawerSize);

        // Mobile drawer max height (unless default)
        const drawerMobileSize = root.style.getPropertyValue("--drawer-mobile-size");
        if (drawerMobileSize) settings.drawerMobileSize = parseFloat(drawerMobileSize);

        try {localStorage.setItem(STORAGE_KEY, JSON.stringify(settings))} catch {} // Storage may be unavailable
    }

    // Save all setting changes
    settingsDrawer.addEventListener("change", saveSettings);
    settingsDrawer.addEventListener("toggle", saveSettings, true); // Toggle does not bubble, so it needs capture
</script>

<!--Class-->
<script>
    const classDiscipline = document.getElementById("class");
    const classPointLink = document.getElementById("class-points-link");

    const classList = () => DISCIPLINES[divePool.value].classes;
    const selectedClass = () => classList().find(({key}) => key === classDiscipline.value);
    const linked = () => classPointLink.ariaPressed === "true";

    // Rebuild the class dropdown when the discipline changes
    function fillClasses() {
        const previousClass = classDiscipline.value;
        classDiscipline.innerHTML = classList().map(({key, label}) => `<option value="${key}">${label}</option>`).join("");
        classDiscipline.value = previousClass;
        // If the selected class does not belong to the discipline, find the closest based on selected points
        if (!classDiscipline.value) selectClassFor(minPoints.value);

        // Hide the class row and the point link when only 1 class (16-way)
        classDiscipline.parentElement.style.display = classPointLink.style.display = classList().length > 1 ? "" : "none";
    }

    // Match the class to the selected points. If no match, find the next highest class. Finally, fallback to the highest/only class.
    // This will cascade update the points field.
    function selectClassFor(points) {
        const classes = classList();
        classDiscipline.value = (classes.find(diveClass => diveClass.points >= points) ?? classes.at(-1)).key;
    }

    // Point selections that don't belong to the class (e.x. 3 - 4 in 8-way) show invalid when selected
    function markPoints() {
        const diveClass = selectedClass();
        const expected = minPoints.querySelector(`[value="${diveClass.points}"]`);
        const message = expected.selected ? "" : `${divePool.selectedOptions[0].text} ${diveClass.label} expects ${expected.text} points`;
        minPoints.setCustomValidity(message); // Mark as invalid
        minPoints.title = message;
    }

    function changeClass() {
        if (linked()) minPoints.value = selectedClass().points;
        markPoints();
        addToPage();
    }

    function changePoints() {
        if (linked()) selectClassFor(minPoints.value);
        markPoints();
        addToPage();
    }

    function changeDiscipline() {
        fillImageSets();
        syncPool();
        indoorSubstituteToast();
        fillClasses();
        changeClass();
    }

    classPointLink.addEventListener("click", () => {
        classPointLink.ariaPressed = !linked();
        if (linked()) changeClass(minPoints.value); // Points updated to match class
    });

    fillClasses();
    markPoints();
</script>
<!--Dive generation-->
<script>
    let generatedDives;

    // Check what cells are locked (if any)
    function lockedCells() {
        const rows = [...diveList.querySelectorAll("li")].map(row => row.querySelectorAll(".cell"));

        return Array.from({length: numDives.value}, (_, i) => Array.from({length: minPoints.value}, (_, j) => {
            const cell = rows[i]?.[j];
            return cell?.classList.contains("locked") ? parsePoint(cell.textContent) : "";
        }));
    }

    // Check if draw cannot change (due to locking)
    function drawUnchanged(locked) {
        const cells = [...diveList.querySelectorAll(".cell")];

        return diveList.querySelectorAll("li").length === numDives.valueAsNumber
            && cells.length === numDives.value * minPoints.value
            && cells.every(cell => cell.classList.contains("locked") || !cell.textContent)
            && locked.every(dive => divePoints(dive) >= minPoints.value);
    }

    // Add dives to the page
    function addToPage() {
        if (!numDives.checkValidity()) return;

        // Generate the draw around any locked cells
        if (lockToggle.ariaPressed === "true") {
            const locked = lockedCells();
            const draw = drawUnchanged(locked) ? "Nothing can change (all values locked)" : fillAroundLocks({...drawSettings(), locked});

            // Show error as toast, instead of clearing the draw
            if (typeof draw === "string") {
                syncEdits();
                showToast(draw);
                return;
            }

            diveList.innerHTML = listDives(draw, minPoints.value, locked);
            syncEdits();
        } else {
            generatedDives = main(drawSettings());
            diveList.innerHTML = listDives(generatedDives, minPoints.value);
        }

        // Add dives to the page
        diveImages.innerHTML = divesAsImages(generatedDives);

        setEditable();
        syncColumns();
    }
</script>
<!--Dive editing-->
<script>
    // Edit toggle
    const editToggle = document.getElementById("editToggle");
    let divesEdited = false;

    editToggle.addEventListener("click", () => {
        const editing = editToggle.ariaPressed !== "true";
        editToggle.ariaPressed = editing;

        // Turn off image preview during edit
        showImages.disabled = editing;
        document.getElementById("preview-text").checked = true;
        syncThumb(previewSegment);

        if (!editing) getSelection().removeAllRanges(); // Clear selection

        setEditable();
    });

    function setEditable() {
        const editing = editToggle.ariaPressed === "true";
        // Locked cells stay read-only
        diveList.querySelectorAll(".cell").forEach(cell => cell.contentEditable = editing && !cell.classList.contains("locked") ? "plaintext-only" : "false");
    }

    // Lock toggle
    const lockToggle = document.getElementById("lock-toggle");

    lockToggle.addEventListener("click", () => {
        const editedCells = diveList.querySelectorAll(".edited");

        // Values modified/added while lock enabled, are re-locked when lock is re-selected
        if (editedCells.length) {
            editedCells.forEach(cell => cell.classList.replace("edited", "locked"));
            setEditable();
            showToast("Changes locked");
            return;
        }

        // Otherwise, toggling the lock will lock/release all filled cells
        const locking = lockToggle.ariaPressed !== "true";
        const cells = [...diveList.querySelectorAll(".cell")];

        if (locking && cells.every(cell => !cell.textContent)) {
            showToast("No values to lock");
            return;
        }

        lockToggle.ariaPressed = locking;

        cells.forEach(cell => cell.classList.toggle("locked", locking && cell.textContent !== ""));
        setEditable();
    });

    // Clear the cells (that are not locked)
    function clearDives() {
        const freeCells = [...diveList.querySelectorAll(".cell:not(.locked)")];

        if (diveList.querySelector(".locked") && freeCells.every(cell => !cell.textContent)) {
            showToast("Nothing to clear (all values are locked)");
            return;
        }

        freeCells.forEach(cell => {
            cell.textContent = "";
            cell.classList.remove("edited");
        });
        syncEdits();

        // Rebuild here, since the focusout rebuild only follows typing
        diveImages.innerHTML = divesAsImages(generatedDives);
    }

    // On user input
    diveList.addEventListener("input", event => {
        const cell = event.target;

        // Limit length to two and strip whitespace
        const normalized = cell.textContent.replace(/\s/g, "").slice(0, 2);
        if (cell.textContent !== normalized) {
            cell.textContent = normalized;

            // User input remains at the end of the input, instead of jumping to start
            getSelection().collapse(cell, cell.childNodes.length);
        }

        // Highlight modified cells (when lock enabled)
        cell.classList.toggle("edited", lockToggle.ariaPressed === "true" && cell.textContent !== "");

        divesEdited = true;
        syncEdits();
    });

    const parsePoint = (text) => /^\d+$/.test(text) ? Number(text) : text.toUpperCase();

    // Write the cells back into generatedDives, then paint rule violations
    function syncEdits() {
        // Clear all (old) invalid markings and tooltips
        diveList.querySelectorAll(".invalid").forEach(marked => {
            marked.classList.remove("invalid");
            marked.removeAttribute("title");
        });

        const rows = [...diveList.querySelectorAll("li")];
        const filledCells = rows.map(row => [...row.querySelectorAll(".cell")].filter(cell => cell.textContent)); // Skip empty cells

        // Set the new draw
        generatedDives = filledCells.map(cells => cells.map(cell => parsePoint(cell.textContent)));

        // Mark cells & rows invalid, and add a tooltip with the reasoning (title)
        validateDraw(generatedDives, drawSettings()).forEach((report, i) => {
            report.cells.forEach((brokenRule, j) => {
                if (!brokenRule) return; // Early exit, as empty titles (tooltips) still show
                filledCells[i][j].classList.add("invalid");
                filledCells[i][j].title = brokenRule;
            });

            rows[i].classList.toggle("invalid", report.invalid);
            if (report.shortRow) rows[i].title = report.shortRow; // Row-level title (tooltip) for too-few points
        });
    }

    // Re-check the draw after a rule has been switched off, or generate one to replace an error message
    function recheckDraw() {
        diveList.querySelector("li") ? syncEdits() : addToPage();
    }

    // Rebuild diveImages after edits are complete. Focusout so that [CTRL+P] is also caught
    diveList.addEventListener("focusout", () => {
        if (divesEdited) {
            divesEdited = false;
            diveImages.innerHTML = divesAsImages(generatedDives);
        }
    });

    /** Keyboard navigation in edit mode **/
    // TODO: Add arrow-key support
    // TODO: Add shift-enter support

    // Select the contents of the cell for editing on focus ([Tab], [Shift] + [Tab], [Enter])
    diveList.addEventListener("focusin", event => {
        if (event.target === diveList) return; // Prevent ugly "select all" on dive-flows when tab navigating

        event.target.scrollIntoView({block: "nearest"}); // Scroll just enough (instead of the default centering jump)
        getSelection().selectAllChildren(event.target); // Select cell's content
    });

    // Keybinds ([Tab], [Shift] + [Tab], [Enter])
    diveList.addEventListener("keydown", event => {
        if (event.target === diveList) return;
        if (event.key !== "Enter" && event.key !== "Tab") return;

        // Navigate to next line after reaching the end of the dive (or from very bottom to top)
        const cells = [...diveList.querySelectorAll(".cell:not(.locked)")]; // Skip locked cells
        const index = cells.indexOf(event.target);
        const nextCell = event.key === "Enter" ? cells[(index + 1) % cells.length] : cells[event.shiftKey ? index - 1 : index + 1];

        if (!nextCell) return; // [Tab] returns to normal function at end of list

        event.preventDefault(); // Stops newline and the native [Tab] move

        nextCell.focus({preventScroll: true}); // Focus the next cell (and use our focus scroll override)
    });
</script>

<script>
    const cache = new Map(); // Cache downscaled data URLs by src

    async function printDives() {
        const printButton = document.getElementById("printButton");
        printButton.disabled = true;

        const originalImages = new Map();
        const images = document.querySelectorAll("#diveImages img");
        const maxWidth = 400; // Scale images down to 400px (~150 DPI), instead of scale (to leave low DPI images alone),

        // Downscale each image once, then reuse from cache
        await Promise.all(Array.from(images).map(async image => {
            if (!cache.has(image.src)) {
                const scale = Math.min(1, maxWidth / image.naturalWidth);
                cache.set(image.src, fetch(image.src)
                    .then(response => response.blob())
                    .then(blob => createImageBitmap(blob, {
                        resizeWidth: Math.round(image.naturalWidth * scale),
                        resizeHeight: Math.round(image.naturalHeight * scale),
                        resizeQuality: "high",
                    }))
                    .then(bitmap => {
                        const canvas = document.createElement("canvas");
                        canvas.width = bitmap.width;
                        canvas.height = bitmap.height;
                        canvas.getContext("2d").drawImage(bitmap, 0, 0);
                        bitmap.close();
                        return canvas.toDataURL("image/png");
                    })
                );
            }
            originalImages.set(image, image.src);
            image.src = await cache.get(image.src);
        }));

        window.print();
        // Restore images after printing
        originalImages.forEach((src, image) => image.src = src);
        printButton.disabled = false;
    }
</script>
<!--Print layout-->
<script>
    const PAPER_MM = { auto: [210, 279.4], Letter: [215.9, 279.4], A4: [210, 297], A5: [148, 210], Legal: [215.9, 355.6] }; // Portrait width and height
    const paperSize = document.getElementById("paperSize");
    const layoutColumns = document.getElementById("layout-columns");
    const columnsPerPage = document.getElementById("columns-per-page");
    const pageSizeRule = document.getElementById("pageSizeRule");

    function setRows(value) {
        diveImages.dataset.rows = value;
        diveImages.style.setProperty("--rows", value); // For CSS calc (to determine page seams)
    }

    function setColumns(value) {
        // Auto-fits the most dives, clamping at 11 (columnsPerPage)
        const autoColumns = Math.min(diveImages.childElementCount, columnsPerPage.lastElementChild.value);
        diveImages.style.setProperty("--columns", value === "auto" ? autoColumns : value);
    }

    // Gray-out counts past the draw, and send a pick past it back to Auto
    function syncColumns() {
        const diveCount = diveImages.childElementCount;
        if (!diveCount) return; // A failed draw prints nothing, so the pick is kept

        // Auto compares as NaN, so it never grays out
        [...columnsPerPage.options].forEach(option => option.disabled = option.value > diveCount); // Cannot use hidden (ignored by Safari for options)
        if (columnsPerPage.selectedOptions[0].disabled) columnsPerPage.value = "auto";
        setColumns(columnsPerPage.value);
    }

    /**
     * Used for determining the width of images in the column print layout
     * All images need to be of the same width to look normal when printed
     * The tallest dive sets the width, as it has to narrow to fit all the points in a single column
     */
    diveImages.addEventListener("load", () => {
        const heightInWidths = (image) => image.naturalHeight / image.naturalWidth || 0; // 0 until loaded
        const diveHeights = [...diveImages.children].map(dive => [...dive.children].reduce((sum, image) => sum + heightInWidths(image), 0));
        diveImages.style.setProperty("--tallest-dive-in-widths", Math.max(...diveHeights));
    }, {capture: true}); // Load events do not bubble up, therefore, wouldn't fire the listener

    function setPage() {
        const landscape = layoutColumns.checked; // Columns lie across a landscape page

        // Row and column height follow the chosen paper, and Auto fits inside both Letter and A4
        const [width, height] = PAPER_MM[paperSize.value];
        diveImages.style.setProperty("--page-height", `${landscape ? width : height}mm`);

        // PDF size is derived from browser, unless manually defined
        const paper = paperSize.value === "auto" ? "" : paperSize.value;
        const size = `${paper} ${landscape ? "landscape" : ""}`.trim();
        pageSizeRule.textContent = size && `@page { size: ${size} }`;
    }
</script>
<!--Toast notification-->
<script>
    const toast = document.getElementById("toast");

    function showToast(message) {
        toast.textContent = message;

        // Reset animation by removing and re-adding the class
        toast.classList.remove("show");
        toast.offsetHeight; // Trigger a reflow, flushing the CSS changes
        toast.classList.add("show");
    }

    // Emptied once faded, so screen readers announce a repeat as new
    toast.addEventListener("animationend", () => toast.textContent = "");
</script>
