# Sync up with rules and images from FSCards
name: Sync FSCards

on:
    schedule:
        - cron: '17 7 * * *'
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

jobs:
    sync:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7 # Check out this repo

            - uses: actions/checkout@v7 # Check out the FSCards repo
              with:
                  repository: Andrewvlad/FSCards
                  path: fscards
                  sparse-checkout: | # Skips figures/ and thumbs/
                      assets/diagrams/4-way/index.js
                      assets/diagrams/4-way/*/*.webp
                      assets/diagrams/8-way/index.js
                      assets/diagrams/8-way/*/*.webp
                      assets/diagrams/16-way/index.js
                      assets/diagrams/16-way/*/*.webp
                      assets/diagrams/4-way-vfs/index.js
                      assets/diagrams/4-way-vfs/*/*.webp
                      assets/diagrams/2-way-mfs/index.js
                      assets/diagrams/2-way-mfs/*/*.webp
                  sparse-checkout-cone-mode: false

            - name: Sync class rules and image sets
              shell: node {0}
              run: |
                  const fs = require('fs');
                  const vm = require('vm');

                  const DISCIPLINES = ['4-way', '8-way', '16-way', '4-way-vfs', '2-way-mfs'];

                  const literal = (value) => Array.isArray(value) ? `[${value.map(literal).join(', ')}]`
                      : typeof value === 'object' ? `{${Object.entries(value).map(([key, item]) => `${key}: ${literal(item)}`).join(', ')}}`
                      : typeof value === 'string' ? `'${value.replace(/['\\]/g, '\\$&')}'`
                      : String(value);

                  const classLines = [];
                  const imageSetLines = [];
                  const indoorLines = [];

                  // Source the class rules and image sets from each respective discipline's file
                  for (const discipline of DISCIPLINES) {
                      const source = fs.readFileSync(`fscards/assets/diagrams/${discipline}/index.js`, 'utf8');
                      const globalName = source.match(/^const (\w+)/m)[1];
                      const {names, classes, sets} = vm.runInNewContext(`${source}\n${globalName}`);

                      classLines.push(`    '${discipline}': [`, ...classes.map(diveClass => `        ${literal(diveClass)},`), '    ],');
                      imageSetLines.push(`    '${discipline}': ${literal(Object.keys(sets))},`);

                      const files = Object.keys(sets).flatMap(set => Object.keys(names).map(key => `${set}/${key}.webp`));

                      // Only 8-way has a separate indoor pool
                      if (discipline === '8-way') {
                          for (const [set, filename] of Object.entries(sets)) {
                              // Only the indoor files that differ from <set>/<key>.webp
                              const indoor = Object.fromEntries(Object.keys(names)
                                  .map(key => [key, filename(key, true)])
                                  .map(([key, file]) => [key, file.includes('/') ? file : `${set}/${file}`]) // Missing USPA indoor images falls back to FAI indoor set
                                  .filter(([key, path]) => path !== `${set}/${key}.webp`));
                              indoorLines.push(`    ${set}: ${literal(indoor)},`);
                              files.push(...Object.values(indoor));
                          }
                      }

                      // Mirror only the images the draw generator shows
                      fs.rmSync(`assets/diagrams/${discipline}`, {recursive: true, force: true});
                      for (const file of files) fs.cpSync(`fscards/assets/diagrams/${discipline}/${file}`, `assets/diagrams/${discipline}/${file}`);
                  }

                  fs.writeFileSync('assets/diagrams/index.js', [
                      '// Populated using FSCards by the sync-fscards GitHub Action',
                      'const CLASSES = {',
                      ...classLines,
                      '};',
                      '',
                      'const IMAGE_SETS = {',
                      ...imageSetLines,
                      '};',
                      '',
                      '// Only 8-way has a separate indoor pool',
                      'const INDOOR_IMAGES = {',
                      ...indoorLines,
                      '};',
                      '',
                  ].join('\n'));

            - name: Open PR
              uses: peter-evans/create-pull-request@v8
              with:
                  add-paths: assets/diagrams
                  commit-message: 'chore: Sync FSCards class rules and image sets'
                  branch: sync-fscards
                  title: 'Sync FSCards class rules and image sets'
                  reviewers: Andrewvlad
                  delete-branch: true
